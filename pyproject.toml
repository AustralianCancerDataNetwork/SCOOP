[project]
name = "scoop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hemonc-alchemy>=0.1.0",
    "ipykernel>=7.1.0",
    "omop-alchemy>=1.1.0",
    "omop-graph>=2.1.0",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scoop*"]

[tool.setuptools.package-data]
scoop = [
    "configuration/**/*.yaml",
    "configuration/**/*.yml",
]
