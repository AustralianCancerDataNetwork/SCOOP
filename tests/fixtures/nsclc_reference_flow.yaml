# Phase 6B NSCLC decision-flow reference fixture.
#
# Generated by, and diffed against, tests/phase6_reference_flow.py /
# tests/test_phase6_reference_flow.py. Do not hand-edit. Regenerate with:
#
#   .venv/bin/python -c "
#   import sys; sys.path.insert(0, 'tests')
#   from phase6_reference_flow import build_reference_flow
#   import yaml
#   open('tests/fixtures/nsclc_reference_flow.yaml', 'w').write(
#       yaml.safe_dump(build_reference_flow(), sort_keys=False, width=100)
#   )
#   "
#
# then re-add this header comment (Write overwrites it) and review the diff.
#
# A diff here means the effective NSCLC decision/bridge/assembly/selection
# behavior changed. Per the 2026-08-15 migration code review (Finding F2):
# an unreviewed diff is a regression signal, not something to regenerate away.
# An intentional diff must name the clinical/content decision that authorized
# it in the same change.
#
# See tests/phase6_reference_flow.py's module docstring for exactly what is
# and is not modeled here (explicit placeholder context values rather than
# sampled patient state; fake HemOnc rows derived mechanically from each
# phase's own declared component_lists; Choice alternatives all resolved
# rather than one being silently picked; Recipe steps assembled without
# inventing rollout/timeline behavior).
