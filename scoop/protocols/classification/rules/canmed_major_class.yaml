# Layer 1 of 4 in the legacy coalesce order (highest precedence).
#
# Transcribed verbatim from scoop.protocols.hemonc.models.MAJOR_CLASS_MAP.
# Matches the HemOnc `canmed_major_class` column exactly (case-sensitive,
# exact string match) -- this is the legacy behavior being reproduced, not a
# design choice for this rule set. See rules/README.md for the coalesce order
# and what "layer" means here.
version: 1
layer: canmed_major_class
rules:
