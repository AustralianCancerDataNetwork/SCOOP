  category: chemotherapy
  source: scoop.protocols.hemonc.models.MAJOR_CLASS_MAP
  rationale: &legacy_rationale >-
    Legacy behavior extracted from SCOOP. The original per-entry rationale
    (from a pre-migration _temp/.../category_mappings.py, per
    functional_specifications.md section 5.5) was lost before this codebase
    was created and is not recoverable from source.
