# Layer 2 of 4 in the legacy coalesce order.
#
# Transcribed verbatim from scoop.protocols.hemonc.models.MAIN_CLASS_MAP.
# Matches the HemOnc `main_class` column exactly (case-sensitive, exact
# string match). Only consulted when layer 1 (canmed_major_class) did not
# match, matching the legacy sa.func.coalesce() order.
version: 1
layer: main_class
rules:
