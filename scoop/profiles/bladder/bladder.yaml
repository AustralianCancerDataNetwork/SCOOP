# Shared entry graph for bladder cancer
# Drafted from: ESMO bladder cancer guideline
# Source: PIIS0923753421048274.pdf
# This entry graph owns shared state and routes people to a pathway-specific
# tail graph. Where the guideline did not provide enough support for a credible
# sampling distribution, equal-probability placeholder splits are used.

graph:
  nodes:
    person.sex:
      type: categorical
      distribution:
        male: 0.75
        female: 0.25

    # placeholder distribution
    person.age_group:
      type: categorical
      distribution:
        lt75: 0.5
        gte75: 0.5

    # placeholder distribution
    person.performance_status:
      type: categorical
      distribution:
        ps0_1: 0.5
        ps2: 0.25
        ps3_plus: 0.25

    # placeholder distribution
    person.frailty:
      type: categorical
      distribution:
        fit: 0.5
        frail: 0.5

    # Feeds condition_start_date (required by OMOP). Placeholder range,
    # matching nsclc.yaml, pending real bladder diagnosis-date data.
    person.year_of_diagnosis:
      type: numeric
      min_value: 2015
      max_value: 2020
      as_int: true

    person.years_since_diagnosis:
      type: numeric
      min_value: 0
      max_value: 3
      as_int: true

    # placeholder distribution
    condition_occurrence.fgfr2_3_alteration:
      type: categorical
      distribution:
        altered: 0.5
        wildtype: 0.5

    # placeholder distribution
    condition_episode.disease_setting:
      type: categorical
      distribution:
        nmibc: 0.25
        mibc_localized: 0.25
        advanced_first_line: 0.25
        advanced_post_platinum: 0.25

    condition_episode.pathway:
      type: branch
      rules:
        - if:
            condition_episode.disease_setting: nmibc
          then: bladder_nmibc
        - if:
            condition_episode.disease_setting: mibc_localized
          then: bladder_mibc_localized
        - if:
            condition_episode.disease_setting: advanced_first_line
          then: bladder_advanced_first_line
        - if:
            condition_episode.disease_setting: advanced_post_platinum
          then: bladder_advanced_post_platinum
      default: bladder_other

  edges: []
