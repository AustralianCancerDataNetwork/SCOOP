# Shared entry graph for small-cell lung cancer
# Drafted from: ESMO 2021 SCLC guideline
# Source: PIIS0923753421011133.pdf
# This entry graph owns shared person-level state and routes people to a
# pathway-specific tail graph. Where the guideline did not provide enough
# information to support a credible sampling distribution, placeholder
# distributions are used.

graph:
  nodes:
    person.sex:
      type: categorical
      distribution:
        male: 0.5
        female: 0.5

    # placeholder distribution
    person.age_group:
      type: categorical
      distribution:
        lte70: 0.5
        gt70: 0.5

    # placeholder distribution
    person.performance_status:
      type: categorical
      distribution:
        ps0_1: 0.34
        ps2: 0.33
        ps3_plus: 0.33

    # placeholder distribution
    person.frailty:
      type: categorical
      distribution:
        fit: 0.5
        frail: 0.5

    # Feeds condition_start_date (required by OMOP). Placeholder range,
    # matching nsclc.yaml, pending real SCLC diagnosis-date data.
    person.year_of_diagnosis:
      type: numeric
      min_value: 2015
      max_value: 2020
      as_int: true

    person.years_since_diagnosis:
      type: numeric
      min_value: 0
      max_value: 3
      as_int: true

    # placeholder distribution
    condition_episode.disease_setting:
      type: categorical
      distribution:
        limited_stage: 0.34
        extensive_stage: 0.33
        recurrent: 0.33

    # placeholder distribution
    condition_episode.limited_stage_path:
      type: categorical
      distribution:
        stage_i_ii_surgical: 0.5
        stage_i_iii_nonsurgical: 0.5
      active_when:
        condition_episode.disease_setting: limited_stage

    condition_episode.pathway:
      type: branch
      rules:
        - if:
            condition_episode.disease_setting: limited_stage
            condition_episode.limited_stage_path: stage_i_ii_surgical
          then: sclc_limited_surgical
        - if:
            condition_episode.disease_setting: limited_stage
            condition_episode.limited_stage_path: stage_i_iii_nonsurgical
          then: sclc_limited_nonsurgical
        - if:
            condition_episode.disease_setting: extensive_stage
          then: sclc_extensive
        - if:
            condition_episode.disease_setting: recurrent
          then: sclc_recurrent
      default: sclc_other

  edges: []
