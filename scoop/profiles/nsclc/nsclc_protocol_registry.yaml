nsclc:
  version: 1
  # The default HemOncKB conditions you want to search over 
  conditions: ["Lung cancer", "Non-small cell lung cancer"]
  source_phases:
  # Every treatment you want included must be specified from source_phases
  # Source phases can be used for standalone protocols or combined.
  # The source phase removal list, if any, is checked against the list of 
  # phases to be combined - it must be a subset. Source phases can be reused.
  # Every source phase must be used as a standalone and/or combined.
  # Unremoved source phases not called by an entry will trigger errors.
  # TODO: replace current system with specifying on source phase if it is
  # combination only?
  # -- phases for stg 1 -------------------------------------------------------
    surgery_only:
        component_requirements:
            category_restrictions:
                surgery:
                    type: min
                    amount: 1
        type: definitive
    port:
        component_requirements:
            category_restrictions:
                radiotherapy:
                    type: min
                    amount: 1
        type: adjuvant
        # Do not create a standalone protocol with this phase only
        # (defaults to true when not specified)
        standalone: False
        # there are other radiation sigs like whole brain irradiation
        regimens: "Radiation therapy" 
    adj_osimertinib:
      component_requirements:
          component_lists: ["Osimertinib"]
          category_restrictions:
              chemotherapy:
                  type: min
                  amount: 1
      type: adjuvant
      standalone: False
  # -- phases for stgs 2&3 resectable -----------------------------------------
    neoadjuvant_chemo_ici:
        component_requirements:
            component_lists: [["nivolumab", "pembrolizumab", "durvalumab", "tislelizumab"]]
            category_restrictions:
                chemotherapy:
                    type: min
                    amount: 1
                immunotherapy: 
                    type: exact
                    amount: 1
        type: neoadjuvant
    adjuvant_ici:
      component_requirements:
        component_lists: [["nivolumab", "pembrolizumab", "durvalumab", "tislelizumab"]]
      type: adjuvant
      category_restrictions:
        immunotherapy:
          type: exact
          amount: 1
    adjuvant_pembrolizumab:
        component_requirements:
            component_lists: "pembrolizumab" # autocorrected to [["pembrolizumab"]] in processing
            category_restrictions:
                immunotherapy: 
                    type: exact
                    amount: 1
        type: adjuvant
    # returns none
    adjuvant_atezolizumab_pembrolizumab:
        component_requirements:
            component_lists: [["atezolizumab", "Pembrolizumab"]]
            category_restrictions:
                immunotherapy: 
                    type: exact
                    amount: 1
        type: adjuvant
    adjuvant_osimertinib:
        component_requirements:
            component_lists: [["osimertinib"]]
            category_restrictions:
                chemotherapy: 
                    type: exact
                    amount: 1
        type: adjuvant
    adjuvant_cisplatin_based: # _osimertinib:
        component_requirements:
            component_lists: [["cisplatin", "carboplatin"]] #, ["osimertinib"]
            category_restrictions: 
                chemotherapy: 
                    type: min
                    amount: 1
        type: adjuvant

    adjuvant_optchemo_alectinib:
        component_requirements:
            component_lists: [["alectinib"]]
            category_restrictions:
                chemotherapy:
                    type: min
                    amount: 1
        type: adjuvant
  # -- phases stg 3 unresectable ----------------------------------------------
    conc_crt:
        component_requirements:
          category_restrictions:
              chemotherapy:
                  type: min
                  amount: 1
              radiotherapy:
                  type: exact
                  amount: 1
    seq_crt_chemo:
        component_requirements:
          category_restrictions:
              chemotherapy:
                  type: min
                  amount: 1
        # sigs can only come from studies which have included radiotherapy
        # given the category restriction, this returns chemo sigs from seq crt studies
        study_restriction: must_have_rt
        standalone: False
    definitive_rt:
        component_requirements:
          category_restrictions:
              supportive: # Note in vis no supportive comp - just in title
                    type: exact
                    amount: 0
              radiotherapy:
                  type: exact
                  amount: 1
        regimens: "Radiation therapy"
        type: definitive
        standalone: False
    consolidation_durvalumab:
        component_requirements:
          component_lists:
              - ["durvalumab"]
          category_restrictions:
              immunotherapy:
                  type: exact
                  amount: 1
        standalone: False
    consolidation_osimertinib:
        component_requirements:
          component_lists:
              - ["Osimertinib"]
          category_restrictions:
              chemotherapy:
                  type: exact
                  amount: 1
        standalone: False
  # -- phases for stg 4 w/ drivers --------------------------------------------
  # TODO: Add extra_conditions field to facilitate drawing from approval under genomic variant 
    egfr_intervention:
        # conditions: [30910] # no results when applied
        component_requirements:
            component_lists: [["osimertinib", "geftinib", "erlotinib", "afatinib", "dacomitinib", "gefitinib"]]
            category_restrictions:
                immunotherapy:
                    type: min
                    amount: 0
                chemotherapy:
                    type: min
                    amount: 1
    alk_intervention:
        # conditions: [30824]
        component_requirements:
            component_lists: [["alectinib", "brigatinib", "lorlatinib", "crizotinib", "ceritinib"]] 
    ros1_intervention:
        # conditions: [30982]
        component_requirements:
            component_lists: [["crizotinib", "entrectinib", "reptrectinib"]] 
    braf_intervention:
        # conditions: [30898]
        component_requirements:
            component_lists: [["dabrafenib"], ["trametinib"]] 
    ret_intervention:
        # conditions: [18383]
        component_requirements:
            component_lists: [["pralsetinib", "selpercatinib"]] 
    erbb2_intervention:
        # conditions: [52958]
        component_requirements:
            component_lists: [["Trastuzumab deruxtecan"]] 
    ntrk_intervention:
        component_requirements:
            component_lists: [["entrectinib", "larotrectinib"]] # ISSUE larotrectinib not specific for nsclc?
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 1
    met_tki:
        component_requirements:
            component_lists: [["capamatinib", "tepotinib"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 1
        standalone: False
    met_ptdb:
        # conditions: [13094]
        component_requirements:
            component_lists: [["Platinum agent"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
        standalone: False
    met_ptdb_w_ici:
        # conditions: [13094]
        component_requirements:
            component_lists: [["Platinum agent"], ["Immunostimulatory monoclonal antibody"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
                immunotherapy:
                    type: min
                    amount: 1
        standalone: False
  # -- phases for stg 4 w/o drivers -------------------------------------------
    # Doesn't work currently - need to:
    # a) change category restrictions
    # b) accurately assess categories w/ regimens including supportive comp. 
    best_supportive_care:
        component_requirements:
            category_restrictions:
                supportive:
                    type: min
                    amount: 1
                radiotherapy: # optional rt allows for palliative rt
                  type: min
                  amount: 0
        curative_intent: no
    platinum_doublet_3rd_gen_agent:
        component_requirements:
            component_lists: [["Platinum agent"], ["taxane", "gemcitabine", "vinorelbine"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
        type: "None"
    platinum_doublet_nonsquamous:
        # The default conditions list won't be used for this treatment scenario
        conditions: [25309] # Can use a string for the condition name if preferred 
        component_requirements:
            component_lists: [["Platinum agent"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
        type: "None"
    ici_w_chemo_nonsquamous:
        conditions: "Non-small cell lung cancer squamous"  # [25309]
        component_requirements:
            component_lists: [["Platinum agent"], ["Immunostimulatory monoclonal antibody"]]
        type: "None"
    ici_w_chemo_squamous:
        conditions: [25316]
        component_requirements:
            component_lists: [["Platinum agent"], ["Immunostimulatory monoclonal antibody"]]
        type: "None"
    ici_monotherapy:
        component_requirements:
            component_lists: [["Immunostimulatory monoclonal antibody"]]
            category_restrictions:
                immunotherapy:
                    type: exact
                    amount: 1
        type: "None"
    ptdb_squamous:
        conditions: [25316]
        component_requirements:
            component_lists: [["Platinum agent"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
        standalone: False
    single_chemo_squamous:
        conditions: [25316]
        component_requirements:
            component_lists: [["gemcitabine", "vinorelbine", "docetaxel"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 1
        standalone: False
    ptdb_nonsquamous:
        conditions: [25309]
        component_requirements:
            component_lists: [["Platinum agent"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 2
        standalone: False
    single_chemo_nonsquamous:
        conditions: [25309]
        component_requirements:
            component_lists: [["gemcitabine", "vinorelbine", "docetaxel", "pemetrexed"]]
            category_restrictions:
                chemotherapy:
                    type: exact
                    amount: 1
        standalone: False
    atezolizumab:
        conditions: [25316]
        component_requirements:
            component_lists: [["atezolizumab"]]
            category_restrictions:
                immunotherapy:
                    type: exact
                    amount: 1
        standalone: False
  phase_combinations:
    # combines phases in the same timestep in an OR relationship
    met_intervention:
        source_phases:
            - met_tki
            - met_ptdb
            - met_ptdb_w_ici
    ici_monotherapy_or_ici_with_chemotherapy_squamous:
        source_phases:
            - ici_monotherapy
            - ici_w_chemo_squamous
    ici_monotherapy_or_ici_with_chemotherapy_nonsquamous:
        source_phases:
            - ici_monotherapy
            - ici_w_chemo_nonsquamous
    # it's ok that the two below have a shared requirement
    # removal of sources is after all combinations are processed
    chemotherapy_or_atezolizumab_squamous:
        source_phases:
            - ptdb_squamous
            - single_chemo_squamous
            - atezolizumab
    chemotherapy_or_atezolizumab_nonsquamous:
        source_phases:
            - ptdb_nonsquamous
            - single_chemo_nonsquamous
            - atezolizumab
  protocols:
    # combines phases sequentially, in order of listing, in an AND relationship
    port_adjuvant_osimertinib:
      phases:
        - surgery_only
        - port
        - adj_osimertinib
    surgery_then_port:
      phases:
       - surgery_only
       - port
    neoadjuvant_or_perioperative_ici_w_chemo:
      phases:
       - neoadjuvant_chemo_ici
       - surgery_only
       - adjuvant_ici
      optional_phases:
       adjuvant_ici:
        criteria:
          shared: component
          as_phase: neoadjuvant_chemo_ici
    adjuvant_cisplatin_osimertinib:
      phases:
       - adjuvant_cisplatin_based
       - adjuvant_osimertinib
    conc_crt_followed_by_durvalumab:
      phases:
       - conc_crt
       - consolidation_durvalumab
    conc_crt_followed_by_osimertinib:
      phases:
       - conc_crt
       - consolidation_osimertinib
    seq_crt_followed_by_durvalumab:
      phases:
       - seq_crt_chemo
       - definitive_rt
       - consolidation_durvalumab
    seq_crt_followed_by_osimertinib:
      phases:
       - seq_crt_chemo
       - definitive_rt
       - consolidation_osimertinib
    seq_crt:
      phases:
       - seq_crt_chemo
       - definitive_rt
  # The below is copied from the regimen registry and has not been
  # evaluated for changing the fields etc. yet
  entries:
    sbrt:
      public: true
      stage_scope: [stage_i]
      clinical_group: local_stage_i
      # review_status: graph_only
      graph_sources: [nsclc_stg1, nsclc]
      exploratory_sources: []
      required_modifiers:
        - condition_episode.operability
      resolver:
        type: bundle_recipe
        group_id: sbrt

    surgery_only:
      public: true
      stage_scope: [stage_i]
      clinical_group: local_stage_i
      # review_status: graph_only
      graph_sources: [nsclc_stg1]
      exploratory_sources: []
      required_modifiers:
        - condition_episode.operability
        - treatment_episode.resection_margin
      resolver:
