morphology:
  type: conditional
  labels: 
    - adenocarcinoma
    - squamous
    - none
  class_probabilities:
    person:
      variant:
        EGFR: [0.9, 0.08, 0.02]
        ALK: [0.85, 0.1, 0.05]
        KRAS: [0.7, 0.25, 0.05]
        BRAF: [0.6, 0.3, 0.1]
        MET: [0.65, 0.25, 0.1]
        ERBB2: [0.7, 0.2, 0.1]
        RET: [0.75, 0.2, 0.05]
        ROS1: [0.8, 0.15, 0.05]
        NTRK: [0.8, 0.15, 0.05]
        default: [0.5, 0.4, 0.1]
    
      sex:
        male: [0.75, 0.2, 0.05]
        female: [0.85, 0.1, 0.05]
        default: [0.8, 0.15, 0.05]

  # Optional: specify how to combine multiple condition sources
  # (can be "multiply", "average", or "hierarchical" if you want control)
  combination: multiply
