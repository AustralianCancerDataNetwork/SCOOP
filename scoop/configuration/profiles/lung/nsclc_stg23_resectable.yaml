# YAML for NSCLC stage 2-3 and resectable
# Drafted by Brianna 
# Last updated: 13/01/2025
# Based on: https://www.annalsofoncology.org/action/showPdf?pii=S0923-7534%2825%2900923-8 
#
# Assumptions/simplifications:
# - It is assumed that all surgeries have R0 result
# - ChT-ICI eligibility is not based on patient or tumour characteristics
# - ChT eligibility is assumed to be solely based on PS, PS > 2 -> ineligible
#
# See: [link diagram/documentation]

graph:
  nodes:

    # sex -> morphology -> egfr & alk probabilitiess
    person.sex:
      type: categorical
      distribution:
        male: 0.55
        female: 0.45

    person.age:
      type: numeric
      mean: 70
      sd: 7
      min_value: 50
      max_value: 95
      as_int: true

    person.age_group:
      type: numeric_range
      from: person.age
      ranges:
        - "<60"
        - "60-69"
        - "70-79"
        - "80+"

    person.performance_status:
      type: categorical
      labels: [ps0, ps1, ps2, ps3, ps4]

    person.performance_status_binary:
      type: categorical
      labels: [not_v_frail, v_frail]

    person.ici_chemo_eligible:
      type: categorical
      distribution:
        eligible: 0.5
        ineligible: 0.5

    condition_occurrence.morphology:
      type: categorical
      labels: [nonsquamous, squamous]

    # This is NOT the same biomarker list used for more advanced nsclc
    condition_occurrence.biomarker:
      type: categorical
      labels: [egfr,  alk, none]

    # Refers to tumour PD-L1
    condition_occurrence.pdl1:
      type: categorical
      labels: ["high", "low", "absent"]

    # Refers to tumour PD-L1
    condition_occurrence.pdl1_binary:
      type: categorical
      labels: ["present", "absent"]

    condition_episode.chemo_eligible:
      type: branch
      rules: 
      - if: { person.performance_status_binary: not_v_frail }
          then: eligible
      - if: { person.performance_status_binary: v_frail }
        then: ineligible
      default: eligible

    # options:
    # neoadjuvant nivolumab + chemotherapy
    # neoadjuvant pembrolizumab + chemotherapy, adj pembrolizumab
    # neoadjuvant durvalumab + chemotherapy, adj durvalumab
    # neoadjuvant nivolumab + chemotherapy, adj nivolumab
    # neoadjuvant tislelizumab + chemotherapy, adj tislelizumab
    treatment_episode.neoadjuvant_chemo_ici:
      type: categorical
      labels: ["neoadj_chemo_ici"]
      active_when:
        person.ici_chemo_eligible: eligible
        condition_occurrence.biomarker: none

    # pembrolizumab for one year
    treatment_episode.adjuvant_pembrolizumab:
      type: categorical
      labels: ["adj_pembro"]
      active_when:
        person.ici_chemo_eligible: ineligible
        condition_occurrence.pdl1_binary: absent
        condition_occurrence.biomarker: none

    # both for one year
    treatment_episode.adjuvant_atezolizumab_pembrolizumab:
      type: categorical
      labels: ["adj_atezo_pembro"]
      active_when:
        person.ici_chemo_eligible: ineligible
        condition_occurrence.pdl1_binary: absent
        condition_occurrence.biomarker: none

    treatment_episode.adjuvant_osimertinib:
      type: categorical
      labels: ["adj_osimertinib"]
      active_when:
        condition_occurrence.biomarker: egfr
        condition_episode.chemo_eligible: ineligible

    # cisplatin as in cisplatin-BASED regimen
    # but carboplatin is fine if patient is cisplatin ineligible
    # osimertinib for 3 years
    # appears to be sequential
    treatment_episode.adjuvant_cisplatin_osimertinib:
      type: categorical
      labels: ["adj_cisplatin_osimertinib"]
      active_when:
        condition_occurrence.biomarker: egfr
        condition_episode.chemo_eligible: eligible

    # I have no idea why this one unlike egfr wasn't separated by chemo eligibility
    # but I thought I should represent as flowchart did
    # as with egfr, appears to be chemo THEN TKI
    treatment_episode.adjuvant_optchemo_alectinib:
      type: categorical
      labels: ["adj_optchemo_alectinib"]
      active_when:
        condition_occurrence.biomarker: alk

  edges:
    - from: condition_occurrence.pdl1
      to: condition_occurrence.pdl1_binary
      using: probability_table
      table:
              # ["present", "absent"]
        high:   [1, 0]
        low:    [1, 0]
        absent: [0, 1]

    - from: person.sex
      to: condition_occurrence.morphology
      using: probability_table
      table:
        male:    [0.75, 0.20]
        female:  [0.85, 0.10]
        default: [0.80, 0.15]

    # Based on: figure 4: DOI:10.1007/s10555-024-10187-6
    - from: condition_occurrence.morphology 
      to: condition_occurrence.biomarker
      using: probability_table
      table:
                   # [egfr,  alk, none]
        nonsquamous: [0.21, 0.07, 0.72]
        squamous:    [0.03,    0, 0.97]

    # PD-L1 proportions
    # https://doi.org/10.1016/j.pathol.2023.08.008
    # The 50 distinction is used in metastatic
    # Just positive (i.e. >1%) is req for earlier
    # So split into the 3 categories
    - from: condition_occurrence.morphology
      to: condition_occurrence.pdl1
      using: probability_table
      table:
                   # ["high", "low", "absent"]
              # i.e. [  >=50,  1-50, >1] 
        nonsquamous: [  0.30,  0.31, 0.39]
        squamous:    [  0.26,  0.38, 0.36]

    - from: person.age_group
      to: person.performance_status
      using: probability_table
      table:
        "<60":   [0.55, 0.30, 0.10, 0.03, 0.02]
        "60-69": [0.50, 0.30, 0.10, 0.05, 0.05]
        "70-79": [0.45, 0.30, 0.15, 0.05, 0.05]
        "80+":   [0.40, 0.30, 0.15, 0.10, 0.05]


    - from: person.performance_status
      to: person.performance_status_binary
      using: probability_table
      table: 
           # [not_v_frail, v_frail]
        ps0: [1, 0]
        ps1: [1, 0]
        ps2: [1, 0]
        ps3: [0, 1]
        ps4: [0, 1]

