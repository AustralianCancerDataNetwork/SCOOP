# YAML for NSCLC stage 1
# Drafted by Brianna 
# Last updated: 13/01/2025
# Based on: https://www.annalsofoncology.org/action/showPdf?pii=S0923-7534%2825%2900923-8 
#
# Assumptions/simplifications:
# - R2 treated as not possible, only R0 and R1 are options.
# - operability is based on ECOG PS only.
#
# See: [link diagram/documentation]

graph:
  nodes:
    person.sex:
      type: categorical
      distribution:
        male: 0.55
        female: 0.45

    person.age:
      type: numeric
      mean: 70
      sd: 7
      min_value: 50
      max_value: 95
      as_int: true

    person.age_group:
      type: numeric_range
      from: person.age
      ranges:
        - "<60"
        - "60-69"
        - "70-79"
        - "80+"

    person.performance_status:
      type: categorical
      labels: [ps0, ps1, ps2, ps3, ps4]

    person.performance_status_binary:
      type: categorical
      labels: [not_v_frail, v_frail]

    condition_occurrence.morphology:
      type: categorical
      labels: [nonsquamous, squamous]

    condition_occurrence.egfr:
      type: categorical
      labels: [not_wt,  wt]

# https://www.nature.com/articles/srep28477/tables/1
# using the cm measures rather than t stage as a proxy
# IA and IB added to find proportions
    condition_occurrence.tumour_size:
      type: categorical
      distribution:
        lt3: 0.78
        gt3: 0.22

  # The numbers I was seeing were so different from paper to paper
  # Might not be worth trying to have high accuracy without specifying
  # type of surgery?
    treatment_episode.resection_margin:
      type: categorical
      distribution:
        r0: 0.7
        r1: 0.3

    condition_episode.operability:
      type: branch
      rules: 
      - if: { person.performance_status_binary: not_v_frail }
        then: operable
      - if: { person.performance_status_binary: v_frail }
        then: inoperable
      default: operable

    treatment_episode.sbrt:
      type: categorical
      labels: ["sbrt"]
      active_when:
        condition_episode.operability: inoperable

    # surgery followed by port
    treatment_episode.port:
      type: categorical
      labels: ["port"]
      active_when:
        condition_episode.operability: operable
        treatment_episode.resection_margin: r1

    # osimertinib for 3 years
    treatment_episode.surgery_adjuvant_osimertinib:
      type: categorical
      labels: ["surgery_adj_osimertinib"]
      active_when:
        condition_episode.operability: operable
        treatment_episode.resection_margin: r1
        condition_occurrence.egfr: not_wt

  # In all other instances, surgery without adjuvant or neoadjuvant therapies
  # My understanding is that we are not interested in these?

  edges:
    - from: person.sex
      to: condition_occurrence.morphology
      using: probability_table
      table:
        male:    [0.75, 0.20]
        female:  [0.85, 0.10]
        default: [0.80, 0.15]

    # Based on: figure 4: DOI:10.1007/s10555-024-10187-6
    - from: condition_occurrence.morphology 
      to: condition_occurrence.egfr
      using: probability_table
      table:
                   # [not_wt, wt]
        nonsquamous: [0.21, 0.79]
        squamous:    [0.03, 0.97]

    - from: person.age_group
      to: person.performance_status
      using: probability_table
      table:
        "<60":   [0.55, 0.30, 0.10, 0.03, 0.02]
        "60-69": [0.50, 0.30, 0.10, 0.05, 0.05]
        "70-79": [0.45, 0.30, 0.15, 0.05, 0.05]
        "80+":   [0.40, 0.30, 0.15, 0.10, 0.05]

    - from: person.performance_status
      to: person.performance_status_binary
      using: probability_table
      table: 
           # [not_v_frail, v_frail]
        ps0: [1, 0]
        ps1: [1, 0]
        ps2: [1, 0]
        ps3: [0, 1]
        ps4: [0, 1]
  