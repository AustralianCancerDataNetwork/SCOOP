# YAML for NSCLC stage 3 and unresectable
# Drafted by Brianna 
# Last updated: 13/01/2025
# Based on: https://www.annalsofoncology.org/action/showPdf?pii=S0923-7534%2825%2900923-8 
#
# Assumptions/simplifications:
# - RT / sequential CRT / concurrent CRT is assumed to be based solely on PS
#
# See: [link diagram/documentation]


graph:
  nodes:

    # sex -> morphology -> egfr probabilities
    person.sex:
      type: categorical
      distribution:
        male: 0.55
        female: 0.45

    person.age:
      type: numeric
      mean: 70
      sd: 7
      min_value: 50
      max_value: 95
      as_int: true

    person.age_group:
      type: numeric_range
      from: person.age
      ranges:
        - "<60"
        - "60-69"
        - "70-79"
        - "80+"

    person.performance_status:
      type: categorical
      labels: [ps0, ps1, ps2, ps3, ps4]

    person.performance_status_binary:
      type: categorical
      labels: [not_v_frail, v_frail]

    condition_occurrence.morphology:
      type: categorical
      labels: [nonsquamous, squamous]

    condition_occurrence.egfr:
      type: categorical
      labels: [not_wt,  wt]

    # Refers to tumour PD-L1
    condition_occurrence.pdl1:
      type: categorical
      labels: ["high", "low", "absent"]

    # Refers to tumour PD-L1
    condition_occurrence.pdl1_binary:
      type: categorical
      labels: ["present", "absent"]

    condition_episode.crt_eligible:
      type: branch
      rules: 
      - if: { person.performance_status_binary: not_v_frail }
          then: eligible
      - if: { person.performance_status_binary: v_frail }
        then: ineligible
      default: eligible

    condition_episode.sequential_crt_eligible:
      type: branch
      rules:
      - if: { performance_status: ps2 }
        then: eligible
      defualt: ineligble

    treatment_episode.radiotherapy:
      type: categorical
      labels: ["rt"]
      active_when:
        condition_episode.crt_eligible: ineligible

    # When adjuvant is not specified it is not present
    treatment_episode.sequential_crt:
      type: categorical
      labels: ["seq_crt"]
      active_when:
        condition_episode.sequential_crt_eligible: eligible
        condition_occurrence.egfr: wt
        condition_occurrence.pdl1_binary: absent

    treatment_episode.concurrent_crt:
      type: categorical
      labels: ["conc_crt"]
      active_when:
        condition_episode.crt_eligible: eligible
        condition_episode.sequential_crt_eligible: ineligible
        condition_occurrence.egfr: wt
        condition_occurrence.pdl1_binary: absent

    treatment_episode.sequential_crt_adjuvant_osimertinib:
      type: categorical
      labels: ["seq_crt_adj_osimertinib"]
      active_when:
        condition_episode.sequential_crt_eligible: eligible
        condition_occurrence.egfr: not_wt

    treatment_episode.concurrent_crt_adjuvant_osimertinib:
      type: categorical
      labels: ["conc_crt_adj_osimertinib"]
      active_when:
        condition_episode.crt_eligible: eligible
        condition_episode.sequential_crt_eligible: ineligible
        condition_occurrence.egfr: not_wt

    treatment_episode.sequential_crt_adjuvant_durvalumab:
      type: categorical
      labels: ["seq_crt_adj_durvalumab"]
      active_when:
        condition_episode.sequential_crt_eligible: eligible
        condition_occurrence.egfr: wt
        condition_occurrence.pdl1_binary: present

    treatment_episode.concurrent_crt_adjuvant_durvalumab:
      type: categorical
      labels: ["conc_crt_adj_durvalumab"]
      active_when:
        condition_episode.crt_eligible: eligible
        condition_episode.sequential_crt_eligible: ineligible
        condition_occurrence.egfr: wt
        condition_occurrence.pdl1_binary: present

  edges:
    - from: condition_occurrence.pdl1
      to: condition_occurrence.pdl1_binary
      using: probability_table
      table:
              # ["present", "absent"]
        high:   [1, 0]
        low:    [1, 0]
        absent: [0, 1]

    - from: person.sex
      to: condition_occurrence.morphology
      using: probability_table
      table:
        male:    [0.75, 0.20]
        female:  [0.85, 0.10]
        default: [0.80, 0.15]

    # Based on: figure 4: DOI:10.1007/s10555-024-10187-6
    - from: condition_occurrence.morphology 
      to: condition_occurrence.egfr
      using: probability_table
      table:
                   # [not_wt, wt]
        nonsquamous: [0.21, 0.79]
        squamous:    [0.03, 0.97]

    # PD-L1 proportions
    # https://doi.org/10.1016/j.pathol.2023.08.008
    # The 50 distinction is used in metastatic
    # Just positive (i.e. >1%) is req for earlier
    # So split into the 3 categories
    - from: condition_occurrence.morphology
      to: condition_occurrence.pdl1
      using: probability_table
      table:
                   # ["high", "low", "absent"]
              # i.e. [  >=50,  1-50, >1] 
        nonsquamous: [  0.30,  0.31, 0.39]
        squamous:    [  0.26,  0.38, 0.36]

    - from: person.age_group
      to: person.performance_status
      using: probability_table
      table:
        "<60":   [0.55, 0.30, 0.10, 0.03, 0.02]
        "60-69": [0.50, 0.30, 0.10, 0.05, 0.05]
        "70-79": [0.45, 0.30, 0.15, 0.05, 0.05]
        "80+":   [0.40, 0.30, 0.15, 0.10, 0.05]


    - from: person.performance_status
      to: person.performance_status_binary
      using: probability_table
      table: 
           # [not_v_frail, v_frail]
        ps0: [1, 0]
        ps1: [1, 0]
        ps2: [1, 0]
        ps3: [0, 1]
        ps4: [0, 1]