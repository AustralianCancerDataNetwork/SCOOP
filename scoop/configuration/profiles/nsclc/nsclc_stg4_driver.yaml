# YAML for NSCLC stage 4 with actionable oncogenic drivers identified
# Drafted by Brianna 
# Last updated: 15/01/2025
# Based on: ESMO living guidelines
# https://www.esmo.org/guidelines/living-guidelines/esmo-living-guideline-non-oncogene-addicted-metastatic-non-small-cell-lung-cancer/management-with-systemic-therapy


graph:
  nodes:
    # Tail graph: this pathway assumes biomarker status has already been
    # established by the shared NSCLC entry graph and inherited as upstream state.
    # Excluding exon 20 insertion
    # Options:
    # osimertinib
    # geftinib
    # erlotinib, erlotinib-bevacizumab, erlotinib-ramacinumab
    # afatinib
    # dacomitinib
    # gefitinib-carboplatin-pemetrexed
    treatment_episode.egfr_intervention:
      type: categorical
      labels: ["egfr_int"]
      active_when:
        condition_occurrence.biomarker: egfr

    # Options:
    # alectinib
    # brigatinib
    # lorlatinib
    # crizotinib
    # ceritinib
    treatment_episode.alk_intervention:
      type: categorical
      labels: ["alk_int"]
      active_when:
        condition_occurrence.biomarker: alk

    # Options:
    # crizotinib
    # entrectinib
    # repotrectinib
    treatment_episode.ros1_intervention:
      type: categorical
      labels: ["ros1_int"]
      active_when:
        condition_occurrence.biomarker: ros1

    # Options:
    # dabrafenib-trametinib
    treatment_episode.braf_intervention:
      type: categorical
      labels: ["braf_int"]
      active_when:
        condition_occurrence.biomarker: braf

    # Options:
    # pralsetinib
    # selpercatinib
    treatment_episode.ret_intervention:
      type: categorical
      labels: ["ret_int"]
      active_when:
        condition_occurrence.biomarker: ret

    # Options:
    # trastuzumab-deruxtecan
    treatment_episode.erbb2_intervention:
      type: categorical
      labels: ["erbb2_int"]
      active_when:
        condition_occurrence.biomarker: erbb2

    # Options:
    # entrectinib
    # larotrectinib
    treatment_episode.ntrk_intervention:
      type: categorical
      labels: ["ntrk_int"]
      active_when:
        condition_occurrence.biomarker: ntrk

    # Options:
    # Pt doublet with or without ICI
    # Capamatinib
    # Tepotinib
    treatment_episode.met_intervention:
      type: categorical
      labels: ["met_int"]
      active_when:
        condition_occurrence.biomarker: met

  edges: []
