age:
  type: numeric
  mean: 70
  sd: 7
  min_value: 50
  max_value: 95
  as_int: true

# 2020 is limit of input df for morphology selection
year_of_diagnosis:
  type: numeric
  min_value: 2015
  max_value: 2020
  as_int: true

years_since_diagnosis:
  type: numeric
  min_value: 0
  max_value: 3
  as_int: true

sex:
  type: labelled
  probs:
    male: 0.55
    female: 0.45

smoking_history:
  type: labelled
  probs:
    never: 0.4
    former: 0.4
    current: 0.2

weight:
  type: numeric
  mean: 80
  sd: 15

ecog:
  type: discrete_numeric
  probs:
    0: 0.2
    1: 0.2
    2: 0.2
    3: 0.2
    4: 0.2

variant:
  type: labelled
  probs:
    egfr: 0.2
    erbb2: 0.03
    alk: 0.1 
    ros1: 0.02
    ret: 0.03
    ntrk: 0.02
    met: 0.05
    braf: 0.05
    kras: 0.1
    none: 0.4