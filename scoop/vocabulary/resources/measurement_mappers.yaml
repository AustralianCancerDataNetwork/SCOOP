weight:
  measurement_concept_id: 4099154        # Body weight (SNOMED)
  type: numeric
  unit_concept_id: 9529                  # kilogram (UCUM)
  drop: true

ecog:
  measurement_concept_id: 36305384       # ECOG Performance Status score (LOINC)
  type: numeric
  drop: true
pdl1:
  measurement_concept_id: 1092026        # Tumor area infiltrated with PD-L1 expressing
                                         # immune cells/Total tumor area [Area Fraction]
                                         # in Tissue by Immune stain (LOINC)
  type: numeric
  unit_concept_id: 8554                  # percent (UCUM)
  value_proxy_map:
    absent: 0
    negative: 0
    neg: 0
    low: 10
    medium: 50
    med: 50
    high: 75
    present: 50
    positive: 50
    pos: 50
  passthrough_numeric: true
  drop: false

stage:
  # Keep the TNM clinical stage-group concept as the measurement anchor. The
  # selected stage node is written as value_as_concept_id; its descendants are
  # intentionally eligible, including classification descendants of the
  # hierarchy. This represents one stage observation without flattening the
  # stage vocabulary into a local list of concept IDs.
  measurement_concept_id: 35918597       # TNM Clin Stage Group (NAACCR)
  type: categorical
  modifier_map: cancer_stage
  event_id_attr: condition_occurrence_id
  event_field_concept_id: 1147127        # condition_occurrence.condition_occurrence_id (CDM)
  drop: false

laterality:
  measurement_concept_id: 35918306       # Laterality (NAACCR)
  type: categorical
  value_map: laterality
  event_id_attr: condition_occurrence_id
  event_field_concept_id: 1147127        # condition_occurrence.condition_occurrence_id (CDM)
  drop: false
