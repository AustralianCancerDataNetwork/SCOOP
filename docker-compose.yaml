volumes:
  postgres-hemonc:
   # Not strictly necessary and can lead to naming conflicts but for now should be fine I think
    name: postgres-hemonc
    
networks:
  hemonc-network:
    name: hemonc-network
    driver: bridge

services:
  hemonc-database:
    image: postgres:16-alpine
    container_name: hemonc-database
    networks:
      - hemonc-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/home/data:rw
      - postgres-hemonc:/var/lib/postgresql/data
      #hoping adding the below will allow me to work there
      - ./work:/home/work:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5555:5432

  # I am adding a python service here
  python-scoop:
    build:
      context: .
      dockerfile: DOCKERFILE # You may need to adapt the path to your Dockerfile and the context during build
      target: prod
    image: python-scoop:latest
    restart: always
    depends_on:
      hemonc-database:
        condition: service_healthy
    command: 
      sleep infinity # This keeps the container running for development.
    networks:
      - hemonc-network